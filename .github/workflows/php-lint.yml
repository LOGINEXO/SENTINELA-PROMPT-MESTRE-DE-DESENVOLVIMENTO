name: PHP interface lint and local-only smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check PHP syntax
        run: php -l web/index.php
      - name: Smoke test local-only interface without login
        shell: bash
        run: |
          set -euo pipefail
          SENTINELA_LOCAL_MODE=1 php -S 127.0.0.1:8081 -t web >/tmp/sentinela-php-local.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          code=""
          for attempt in {1..30}; do
            code="$(curl --silent --show-error --output /tmp/sentinela-body --write-out '%{http_code}' http://127.0.0.1:8081/ || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 0.2
          done
          if [ "$code" != "200" ]; then
            cat /tmp/sentinela-php-local.log
            echo "Expected HTTP 200 on loopback without login; got $code"
            exit 1
          fi
          code="$(curl --silent --show-error --header 'X-Forwarded-For: 203.0.113.8' --output /tmp/sentinela-body --write-out '%{http_code}' http://127.0.0.1:8081/)"
          if [ "$code" != "403" ]; then
            cat /tmp/sentinela-php-local.log
            echo "Expected HTTP 403 when forwarded headers are present; got $code"
            exit 1
          fi
