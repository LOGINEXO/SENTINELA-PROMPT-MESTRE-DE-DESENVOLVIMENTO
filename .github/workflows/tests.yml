name: Sentinela tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Linux shell script syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install-linux.sh scripts/start-linux.sh
      - name: Validate Windows PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @("scripts/install-windows.ps1", "scripts/start-windows.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run tests
        run: python -m pytest -q
