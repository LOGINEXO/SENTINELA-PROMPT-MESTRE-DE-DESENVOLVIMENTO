name: Build Windows installer

on:
  push:
    branches:
      - main
      - feature/instalador-gui-sem-certificado
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path $env:ProgramFiles(x86) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado apos instalar Inno Setup." }
          & $iscc "installer\Sentinela-Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Compilacao Inno Setup falhou." }
          if (-not (Test-Path "installer\output\Sentinela-Setup.exe")) {
            throw "O arquivo Sentinela-Setup.exe nao foi gerado."
          }

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentinela-Setup-unsigned
          path: installer/output/Sentinela-Setup.exe
          if-no-files-found: error
          retention-days: 30
